<!DOCTYPE html>
<html>
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="theme-color" content="#ffffff">
    <title>Tada - Ada Package Manager</title>
    <style type="text/css">
      @import url('https://rsms.me/inter/inter.css');

      *, *::before, *::after {
        box-sizing: border-box;
      }
      * {
        margin: 0;
      }
      html, body {
        height: 100%;
      }
      body {
        font-family: Inter, Verdana, sans-serif;
        line-height: 2;
        -webkit-font-smoothing: antialiased;
        margin: auto;
        padding: 20px;
        max-width: 760px;
        text-align: justify;
        background-color: #fff;
        word-wrap: break-word;
        overflow-wrap: break-word;
      }
      a {
        color: #3273dc;
        cursor: pointer;
        text-decoration: underline;
      }
      p {
        text-align: justify;
        margin: 16px 0;
      }
      header p {
        margin: 0;
      }
      header h1 {
        margin-bottom: 0;
      }
      p, h1, h2, h3, h4, h5, h6 {
        overflow-wrap: break-word;
      }
      h1, h2, h3, h4, h5, h6 {
        & > a {
          color: inherit !important;
          text-decoration: inherit !important;
        }
      }
      header {
        margin-bottom: 32px;
        line-height: 1.2;
      }
      footer {
        margin: 32px 0;
      }
      h2 {
        font-size: 48px;
      }
      h1, h2, h3, h4, h5, h6 {
        display: block;
        text-align: left;
        margin-top: 32px;
        margin-bottom: 4px;
      }
      .button {
        cursor: pointer;
        background: #3273dc;
        color: #fff;
        border: 1px solid #3273dc;
        padding: .375rem .75rem;
        margin: 8px 0;
        display: inline-block;
      }
      a.button {
        text-decoration: none;
        padding: 8.5px 12px
      }
      .button-outline {
        color: #3273dc;
        background: #fff;
      }
      ul {
        list-style-type: square;
      }
      nav ul {
        list-style-type: none;
        padding-inline-start: 0;
      }
      nav ul li {
        display: inline-block;
        margin: 8px;
      }
      nav ul li:first-child {
        margin-left: 0;
      }
      nav ul li:last-child {
        margin-right: 0;
      }
      th, td {
        padding: 8px;
      }
      pre {
        padding: 16px 8px;
        line-height: 1;
        overflow-x: auto;
        max-width: 100%;
        font-size: 16px;
      }
      .text-center {
        text-align: center;
      }
      .giallo-l {
        display: inline-block;
        min-height: 1lh;
        width: 100%;
      }
      .giallo-ln {
        display: inline-block;
        user-select: none;
        margin-right: 0.4em;
        padding: 0.4em;
        min-width: 3ch;
        text-align: right;
        opacity: 0.8;
      }
    </style>
  </head>
  <body>
    <header>
      <h1><a href="/">Tada</a></h1>
      <h2>Ada package manager</h2>
    </header>

    {% block content %} {% endblock content %}

    <footer>
      <p class="text-center">
        <img src="https://img.shields.io/badge/-inside-blue?logo=ada&logoColor=white&labelColor=grey&logoSize=auto&style=flat-square" />
      </p>
    </footer>

    <script async src="https://rum.cronitor.io/script.js"></script>
    <script>
      window.cronitor = window.cronitor || function() { (window.cronitor.q = window.cronitor.q || []).push(arguments); };
      cronitor('config', { clientKey: '9554e333e7dfabd0280c6760908b948c' });
    </script>
  </body>
</html>
